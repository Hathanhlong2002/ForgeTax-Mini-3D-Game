<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 280" width="512" height="280">
  <defs>
    <radialGradient id="fireGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7a1a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ff3b00" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2a0d02" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5a0"/>
      <stop offset="30%" stop-color="#ffd700"/>
      <stop offset="70%" stop-color="#d48806"/>
      <stop offset="100%" stop-color="#693b00"/>
    </linearGradient>
    <linearGradient id="steelBlade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a8a9e"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#d0dbe8"/>
      <stop offset="100%" stop-color="#4a5868"/>
    </linearGradient>
    <filter id="epicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Crest -->
  <circle cx="256" cy="140" r="130" fill="url(#fireGlow)"/>

  <!-- Crossed Katanas in Background -->
  <g filter="url(#epicGlow)">
    <!-- Blade 1: Top-Left to Bottom-Right -->
    <path d="M70 40 L442 240 L432 245 L62 45 Z" fill="url(#steelBlade)" stroke="#222" stroke-width="1.5"/>
    <!-- Blade 2: Top-Right to Bottom-Left -->
    <path d="M442 40 L70 240 L62 235 L432 35 Z" fill="url(#steelBlade)" stroke="#222" stroke-width="1.5"/>
  </g>

  <!-- Central Dragon Shield Crest -->
  <path d="M256 30 Q330 60 350 140 Q330 220 256 260 Q182 220 162 140 Q182 60 256 30 Z" 
        fill="#1a1109" stroke="url(#goldSheen)" stroke-width="7"/>
  <path d="M256 46 Q316 72 332 140 Q316 208 256 244 Q196 208 180 140 Q196 72 256 46 Z" 
        fill="none" stroke="#e8b33c" stroke-width="2" stroke-dasharray="6 4" opacity="0.7"/>

  <!-- Anvil Silhouette inside Shield -->
  <path d="M210 135 L302 135 L288 155 L282 175 L230 175 L224 155 Z" fill="url(#goldSheen)"/>
  <!-- Hammer Striking Anvil with Fire Spark -->
  <polygon points="256,70 270,105 242,105" fill="#ff7a1a" filter="url(#epicGlow)"/>
  <circle cx="256" cy="115" r="9" fill="#fffbcf" filter="url(#epicGlow)"/>
</svg>