<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="scrollGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0d0"/>
      <stop offset="60%" stop-color="#dfc090"/>
      <stop offset="100%" stop-color="#b08a50"/>
    </linearGradient>
    <radialGradient id="waxSeal" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff4a3a"/>
      <stop offset="60%" stop-color="#c41810"/>
      <stop offset="100%" stop-color="#6e0802"/>
    </radialGradient>
  </defs>
  <!-- Rolled Scroll -->
  <rect x="24" y="20" width="80" height="88" rx="8" fill="url(#scrollGrad)" stroke="#6e4820" stroke-width="4"/>
  <!-- Scroll lines -->
  <line x1="36" y1="38" x2="92" y2="38" stroke="#7a5530" stroke-width="3" stroke-linecap="round"/>
  <line x1="36" y1="52" x2="80" y2="52" stroke="#7a5530" stroke-width="3" stroke-linecap="round"/>
  <line x1="36" y1="66" x2="88" y2="66" stroke="#7a5530" stroke-width="3" stroke-linecap="round"/>
  <!-- Royal Wax Seal -->
  <circle cx="86" cy="88" r="18" fill="url(#waxSeal)" stroke="#450400" stroke-width="2"/>
  <circle cx="86" cy="88" r="12" fill="none" stroke="#ff9588" stroke-width="1.5"/>
  <polygon points="86,80 90,89 82,89" fill="#ffd9d0"/>
</svg>