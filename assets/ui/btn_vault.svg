<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="vaultBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1e12"/>
      <stop offset="70%" stop-color="#140d07"/>
      <stop offset="100%" stop-color="#050302"/>
    </radialGradient>
    <linearGradient id="goldGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5a0"/>
      <stop offset="35%" stop-color="#ffd700"/>
      <stop offset="75%" stop-color="#d48806"/>
      <stop offset="100%" stop-color="#724100"/>
    </linearGradient>
    <linearGradient id="bronzeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eed5a5"/>
      <stop offset="30%" stop-color="#b8860b"/>
      <stop offset="70%" stop-color="#5c3809"/>
      <stop offset="100%" stop-color="#2b1700"/>
    </linearGradient>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="240" fill="url(#vaultBg)" stroke="url(#bronzeBorder)" stroke-width="14"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#e8b33c" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  <!-- Gold pile overflow -->
  <g filter="url(#glowGold)">
    <ellipse cx="256" cy="220" rx="110" ry="40" fill="#ffd700" opacity="0.85"/>
    <circle cx="210" cy="205" r="18" fill="url(#goldGleam)"/>
    <circle cx="245" cy="195" r="22" fill="url(#goldGleam)"/>
    <circle cx="285" cy="200" r="20" fill="url(#goldGleam)"/>
    <circle cx="310" cy="215" r="16" fill="url(#goldGleam)"/>
  </g>
  <!-- Chest Body -->
  <path d="M130 250 L382 250 L360 380 L152 380 Z" fill="#3d2817" stroke="#b8860b" stroke-width="8"/>
  <!-- Metal bands -->
  <rect x="175" y="250" width="22" height="130" fill="url(#goldGleam)"/>
  <rect x="315" y="250" width="22" height="130" fill="url(#goldGleam)"/>
  <!-- Chest Lid Rim -->
  <path d="M120 250 Q256 220 392 250 L382 230 Q256 195 130 230 Z" fill="#694121" stroke="url(#goldGleam)" stroke-width="6"/>
  <!-- Keyhole Lock Plate -->
  <rect x="238" y="270" width="36" height="48" rx="6" fill="url(#goldGleam)" stroke="#5c3809" stroke-width="3"/>
  <circle cx="256" cy="286" r="6" fill="#140d07"/>
  <polygon points="253,288 259,288 261,304 251,304" fill="#140d07"/>
</svg>